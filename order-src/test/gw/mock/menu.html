<!doctype html><html><head><meta charset="utf-8"></head><body>
<ul id="tree">
 <li><span class="tree-title">시스템관리</span></li>
 <li><span class="tree-title" id="f1">주문정보관리</span>
   <ul id="c1" style="display:none"><li><span class="tree-title" id="f2">주문등록</span><ul id="c2"></ul></li></ul></li>
</ul>
<script>
document.getElementById("f1").onclick = function () { var c = document.getElementById("c1"); c.style.display = c.style.display === "none" ? "" : "none"; };
document.getElementById("f2").onclick = function () { var c = document.getElementById("c2"); if (!c.children.length) { c.innerHTML = '<li><span class="tree-title" id="leaf">주문등록</span></li><li><span class="tree-title" id="leaf2">주문현황</span></li>'; document.getElementById("leaf").onclick = function () { parent.openTab("grid.html"); }; } };
</script></body></html>
