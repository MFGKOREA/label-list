<!doctype html><html><head><meta charset="utf-8"><title>Set판매현황</title><script src="jquery.js"></script></head><body>
Set판매현황
<!-- 가짜 MIS Set판매현황: 11/15 실제 조회에서 본 모양(treegrid "tg", 매장마다 한 줄, 세트마다 수량·금액·% 칸). 숫자는 지어낸 것 -->
<input id="sDate" class="easyui-datebox" value="2026-11-13"><input id="eDate" class="easyui-datebox" value="2026-11-13">
<a href="#" class="easyui-linkbutton" onclick="fn_Search()"><span class="l-btn-text">조회</span></a>
<table id="tg"></table>
<script>
$("input.easyui-datebox").each(function () { $(this).data("datebox", 1); });
$.fn.datebox = function (cmd, v) { if (cmd === "getValue") return this.val(); if (cmd === "setValue") { this.val(v); return this; } };
var SETS = ["ROMANTIC", "PREMIUM", "MGGGR", "MTDB", "WINESET"], NAMES = ["[안심]로맨틱", "매드 프리미엄", "골고루", "미트 더블", "나잇 앤 와인"];
var G1 = [{ title: "매장", colspan: 2 }, { title: "매출", colspan: 6 }, { title: "세트 합계", colspan: 3 }].concat(NAMES.map(function (n) { return { title: n, colspan: 3 }; }));
var G2 = [{ field: "CD_STORE", title: "매장코드" }, { field: "NM_STORE", title: "매장명" }, { field: "GROSS_SALES", title: "Gross Sales" }, { field: "TOTAL_SALES", title: "Total Sales" }, { field: "RESTAURANT_SALES", title: "RESTAURANT Sales" }, { field: "DELIVERY_SALES", title: "DELIVERY Sales" }, { field: "CUST_CNT", title: "매장고객수" }, { field: "TOTAL_PPA", title: "TOTAL PPA" },
  { field: "TOT_CNT", title: "수량" }, { field: "TOT_AMT", title: "금액" }, { field: "TOT_PER", title: "%" }];
SETS.forEach(function (k) { G2.push({ field: k + "_CNT", title: "수량" }, { field: k + "_AMT", title: "금액" }, { field: k + "_PER", title: "%" }); });
var ST = { data: [] };
$.fn.datagrid = function (cmd) { if (cmd === "getRows") return []; if (cmd === "options") return { columns: [G1, G2] }; if (cmd === "getData") return { total: 0, rows: [] }; };
$.fn.treegrid = function (cmd) { if (cmd === "getData") return ST.data; if (cmd === "options") return { columns: [G1, G2] }; };
$("#tg").data("datagrid", 1).data("treegrid", 1);
// 날짜별 [이 매장 고객수, 골고루, 미트 더블, 로맨틱, 프리미엄] — 11/12는 이 매장 세트 없음(다른 매장 줄만), 11/14(토)는 많음
var DAY = { "2026-11-10": [100, 3, 1, 0, 0, 9], "2026-11-12": null, "2026-11-13": [180, 4, 2, 1, 0], "2026-11-14": [420, 11, 6, 2, 1] }; // 11/10: 세트 합계(9)가 세트별 합(4)과 다름 (합계 대조 시험용)
function fn_Search() {
  if (!window.event) throw new Error("no event");
  var s = $("#sDate").val(), v = DAY[s], kids = [];
  var row = function (cd, nm, c, gg, mt, ro, pr, tt) { var r = { CD_STORE: cd, NM_STORE: nm, GROSS_SALES: "9,000,000", TOTAL_SALES: "9,500,000", RESTAURANT_SALES: "9,000,000", DELIVERY_SALES: "0", CUST_CNT: c, TOTAL_PPA: "50,000", TOT_CNT: tt != null ? tt : gg + mt + ro + pr, TOT_AMT: "1,000,000", TOT_PER: "10.0" };
    SETS.forEach(function (k) { r[k + "_CNT"] = 0; r[k + "_AMT"] = "0"; r[k + "_PER"] = "0"; }); r.MGGGR_CNT = gg; r.MTDB_CNT = mt; r.ROMANTIC_CNT = ro; r.PREMIUM_CNT = pr; r.MGGGR_AMT = (gg * 120000).toLocaleString(); return r; };
  kids.push(row("1111111", "다른매장", 300, 50, 50, 5, 5));
  if (v) kids.push(row("1345090", "MG수원컨벤션센터점", v[0], v[1], v[2], v[3], v[4], v[5]));
  var tot = row("", "합계", 0, 0, 0, 0, 0); tot.children = kids;
  setTimeout(function () { ST.data = [tot]; window.__q = (window.__q || 0) + 1; }, 300);
}
</script></body></html>
