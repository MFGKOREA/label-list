<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발주팀 주방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1d2e; --panel: #24273d; --line: #3a3f5c; --fg: #f4ecdf; --muted: #a9a3b8;
    --orange: #d97757; --green: #3ddc00; --yellow: #ffd60a; --red: #ff375f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; }
  h1 { margin: 0; font-family: "Press Start 2P", monospace; font-size: 13px; letter-spacing: .02em; color: var(--orange); }
  .stage { position: relative; border: 4px solid var(--line); border-radius: 4px; background: #000; box-shadow: 0 0 0 4px #111322, 0 10px 30px rgba(0,0,0,.4); }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  .board { position: absolute; left: 32.3%; top: 8.6%; width: 35.4%; height: 16.5%; display: grid; align-content: center; justify-items: center; gap: 2px; pointer-events: none; color: #2b2d42; text-align: center; }
  .board b { font-family: "Press Start 2P", monospace; font-size: clamp(6px, 1.7vw, 10px); }
  .board span { font-size: clamp(8px, 2.1vw, 12px); font-weight: 800; }
  .bubble { position: absolute; transform: translate(-50%, -100%); width: max-content; max-width: 58%; background: #fffdf6; color: #1b1d2e; border: 2px solid #1b1d2e; border-radius: 2px; padding: 5px 7px; font-size: clamp(10px, 2.6vw, 12.5px); font-weight: 700; line-height: 1.35; box-shadow: 3px 3px 0 rgba(0,0,0,.35); pointer-events: none; white-space: normal; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1b1d2e; border-bottom: 0; }
  .bubble small { display: block; font-family: "Press Start 2P", monospace; font-size: 7px; color: var(--orange); margin-bottom: 3px; }
  .hint { margin: 10px 2px 18px; font-size: 12.5px; color: var(--muted); }
  .team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; }
  .card:hover, .card.on { border-color: var(--orange); }
  .card .tag { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--orange); }
  .card b { display: block; margin-top: 6px; font-size: 14px; }
  .card span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .card.boss { grid-column: 1 / -1; }
  .card.boss .tag { color: var(--yellow); }
</style>
</head>
<body>
<div class="wrap">
  <header><a href="order.html">← 발주</a><h1>KITCHEN TEAM</h1></header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="발주팀 픽셀 주방. 팀장과 팀원 A부터 E까지 각자 조리대에서 일하고 있어요."></canvas>
    <div class="board" id="board"><b id="bDate">--.--</b><span id="bFc">Forecast –</span></div>
  </div>
  <p class="hint">캐릭터나 아래 카드를 누르면 지금 하는 일을 말해줘요. 숫자는 구글 시트의 실제 데이터예요.</p>
  <div class="team" id="team"></div>
</div>
<script>
(() => {
  // ---------- 장면 크기 (논리 픽셀) ----------
  const W = 192, H = 144, S = 4;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  cv.width = W * S; cv.height = H * S; ctx.scale(S, S); ctx.imageSmoothingEnabled = false;
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  // 문자열 스프라이트: 글자마다 색, "."은 투명
  const sprite = (rows, x, y, pal, k = 1) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== "." && pal[ch]) px(x + i * k, y + j * k, k, k, pal[ch]); }));

  // ---------- 팀 ----------
  const TEAM = [
    { id: "boss", tag: "BOSS", name: "팀장 (나)", role: "최종 결정", hat: "crown", screen: "big", desk: [140, 120] },
    { id: "A", tag: "A", name: "데이터 분석가", role: "정확도·학습 분석", hat: "cap", screen: "chart", desk: [8, 82] },
    { id: "B", tag: "B", name: "레시피·단위 담당", role: "레시피 연결·단위 관리", hat: "chef", screen: "board", desk: [74, 82] },
    { id: "C", tag: "C", name: "발주·프랩 검수관", role: "발주량·프랩량 점검", hat: "helmet", screen: "check", desk: [140, 82] },
    { id: "D", tag: "D", name: "디자이너", role: "화면 디자인", hat: "beret", screen: "plate", desk: [8, 120] },
    { id: "E", tag: "E", name: "QA", role: "테스트·버그 찾기", hat: "band", screen: "test", desk: [74, 120] },
  ];
  const ORANGE = "#d97757", DARK = "#a4553b";
  const BODY = [
    "..OOOOOOOO..",
    "..OOOOOOOO..",
    "..OKOOOOKO..",
    "OOOOOOOOOOOO",
    "OOOOOOOOOOOO",
    "..OOOOOOOO..",
    "..O.O..O.O..",
    "..O.O..O.O..",
  ];
  const BLINK = BODY.map((r, j) => (j === 2 ? "..OOOOOOOO.." : r));
  const HATS = {
    crown: { rows: ["..Y.Y..Y.Y..", "..YYYYYYYY.."], pal: { Y: "#ffd60a" }, dy: -2 },
    cap: { rows: ["..GGGGGGGG..", "..GGGGGGGGGG"], pal: { G: "#3ddc00" }, dy: -2 },
    chef: { rows: ["...WWWWWW...", "..WWWWWWWW..", "..WWWWWWWW..", "...wwwwww..."], pal: { W: "#ffffff", w: "#d8d8e0" }, dy: -4 },
    helmet: { rows: ["...RRRRRR...", "..RRRRRRRR..", ".RRRRRRRRRR."], pal: { R: "#ff375f" }, dy: -3 },
    beret: { rows: [".....P......", "..PPPPPPP...", ".PPPPPPPPP.."], pal: { P: "#ff8fcf" }, dy: -3 },
    band: { rows: ["..VVVVVVVV.."], pal: { V: "#9b7bff" }, dy: 0 },
  };
  // 3x5 픽셀 글자 (책상 명패)
  const FONT = { M: ["10001", "11011", "10101", "10001"], F: ["111", "100", "110", "100"], G: ["0111", "1000", "1011", "0111"], A: ["010", "101", "111", "101", "101"], B: ["110", "101", "110", "101", "110"], C: ["011", "100", "100", "100", "011"], D: ["110", "101", "101", "101", "110"], E: ["111", "100", "110", "100", "111"] };
  const letter = (ch, x, y, c) => (FONT[ch] || []).forEach((r, j) => [...r].forEach((b, i) => b === "1" && px(x + i, y + j, 1, 1, c)));

  // ---------- 배경: 주방 ----------
  function room(t) {
    // 흰 타일 벽 (줄눈)
    px(0, 0, W, 58, "#eceff2");
    for (let y = 0; y < 58; y += 6) { px(0, y, W, 1, "#d3d8de"); for (let x = (y / 6) % 2 ? 0 : 6; x < W; x += 12) px(x, y, 1, 6, "#d3d8de"); }
    // 후드
    px(4, 0, W - 8, 5, "#a7b0b9"); px(4, 5, W - 8, 2, "#8a939c"); for (let x = 20; x < W - 10; x += 40) px(x, 7, 6, 1, (Math.floor(t / 700) + x) % 3 ? "#fff6c2" : "#ffe27a");
    // 워크인 냉장고 문
    px(6, 12, 40, 44, "#9aa3ac"); px(8, 14, 36, 42, "#c3cad1"); px(38, 30, 3, 10, "#5f6770");
    px(14, 20, 24, 12, "#e9f6ff"); px(25, 21, 2, 10, "#7ec8ff"); px(20, 25, 12, 2, "#7ec8ff"); px(21, 22, 2, 2, "#7ec8ff"); px(29, 22, 2, 2, "#7ec8ff"); px(21, 28, 2, 2, "#7ec8ff"); px(29, 28, 2, 2, "#7ec8ff");
    // 티켓 레일 + 주문서 (가운데 큰 주문서에 날짜·Forecast를 HTML로 덮음)
    px(56, 8, 80, 2, "#5f6770");
    const sway = Math.round(Math.sin(t / 600));
    [[58, 9], [124, 10]].forEach(([x, h], i) => { px(x + (i ? sway : -sway), 10, 10, 14 + h % 3, "#fffdf6"); for (let k = 0; k < 4; k++) px(x + 2 + (i ? sway : -sway), 13 + k * 3, 6, 1, "#c7c2b8"); });
    px(62, 11, 68, 26, "#fffdf6"); for (let x = 64; x < 130; x += 4) px(x, 36, 2, 2, "#eceff2"); px(62, 11, 68, 2, "#ff375f");
    // 선반: 서드 팬·식스 팬
    px(146, 14, 42, 2, "#8a939c"); px(146, 32, 42, 2, "#8a939c");
    [["#e8553d", 148], ["#3ddc00", 158], ["#ffd60a", 168], ["#f4f1ea", 178]].forEach(([c, x]) => { px(x, 8, 8, 6, "#c3cad1"); px(x + 1, 9, 6, 2, c); });
    [["#9b6a3a", 148], ["#ff8fcf", 160], ["#7ec8ff", 172]].forEach(([c, x]) => { px(x, 24, 10, 8, "#c3cad1"); px(x + 1, 25, 8, 3, c); });
    // 걸린 국자·프라이팬
    px(150, 36, 1, 8, "#5f6770"); px(148, 44, 5, 3, "#5f6770"); px(162, 36, 1, 5, "#5f6770"); px(158, 41, 10, 4, "#3a3f46"); px(168, 42, 6, 1, "#3a3f46");
    px(178, 36, 1, 9, "#5f6770"); px(176, 45, 5, 2, "#a7b0b9");
    // 걸레받이 + 빨간 쿼리 타일 바닥
    px(0, 56, W, 3, "#8a939c");
    for (let y = 59; y < H; y += 8) for (let x = 0; x < W; x += 8) { px(x, y, 8, 8, ((x + y) / 8) % 2 ? "#a64a35" : "#b5523b"); px(x, y, 8, 1, "#8e3e2c"); px(x, y, 1, 8, "#8e3e2c"); }
  }

  // ---------- 조리대 위 화면·도구 ----------
  function screen(kind, x, y, t) {
    const f = Math.floor(t / 400);
    if (kind === "board") { // 도마 + 칼 + 채소 (B)
      px(x - 2, y + 9, 16, 5, "#d9a066"); px(x - 2, y + 13, 16, 1, "#b07a45");
      px(x + 1 + (f % 2), y + 10, 3, 2, "#3ddc00"); px(x + 6, y + 10, 3, 2, "#e8553d");
      px(x + 10, y + 6 + (f % 2) * 2, 1, 5, "#c3cad1"); px(x + 10, y + 11 + (f % 2) * 2, 1, 2, "#3a3f46");
      return;
    }
    if (kind === "plate") { // 플레이팅 접시 (D)
      px(x - 1, y + 8, 15, 5, "#fffdf6"); px(x, y + 13, 13, 1, "#d3d8de");
      ["#ff375f", "#ffd60a", "#3ddc00", "#7ec8ff"].forEach((c, i) => px(x + 2 + i * 3, y + 9 + ((f + i) % 2), 2, 2, c));
      return;
    }
    // 주방 모니터(KDS)
    px(x, y, 14, 11, "#3a3f46"); px(x + 1, y + 1, 12, 8, "#0f1a2b"); px(x + 6, y + 11, 2, 3, "#5f6770");
    if (kind === "chart") [3, 5, 2, 6, 4].forEach((h, i) => { const hh = 1 + ((h + f + i) % 6); px(x + 2 + i * 2, y + 9 - hh, 1, hh, "#3ddc00"); });
    if (kind === "check") for (let i = 0; i < 3; i++) { px(x + 2, y + 2 + i * 2, 1, 1, i <= f % 4 ? "#3ddc00" : "#555a7a"); px(x + 4, y + 2 + i * 2, 6, 1, "#a9a3b8"); }
    if (kind === "test") for (let i = 0; i < 3; i++) px(x + 2, y + 2 + i * 2, 8, 1, (f + i) % 5 === 0 ? "#ff375f" : "#3ddc00");
    if (kind === "big") { px(x + 2, y + 3, 8, 3, f % 2 ? "#ffd60a" : "#d97757"); px(x + 2, y + 7, 5, 1, "#a9a3b8"); }
  }

  // ---------- 캐릭터 ----------
  const pos = {};
  function member(m, i, t) {
    const [dx, dy] = m.desk, K = 2, DW = 44;               // 캐릭터는 2배 픽셀
    const bob = Math.floor((t / 450 + i * 0.7) % 2);       // 숨 쉬듯 위아래
    const blink = (t / 100 + i * 17) % 38 < 1.5;             // 가끔 눈 깜빡
    const x = dx + 2, y = dy - 16 + bob;
    pos[m.id] = { x: x + 12, y: y - 5 };
    sprite(blink ? BLINK : BODY, x, y, { O: ORANGE, K: "#1b1d2e" }, K);
    px(x + 6, y + 9, 12, 4, "#fffdf6"); // 앞치마
    // 검정 마스크 (눈 아래)
    px(x + 5, y + 6, 14, 3, "#15161c"); px(x + 3, y + 6, 2, 1, "#15161c"); px(x + 19, y + 6, 2, 1, "#15161c");
    // 검정 모자 + MFG
    px(x + 4, y - 4, 16, 2, "#15161c"); px(x + 2, y - 2, 20, 4, "#15161c"); px(x + 18, y + 1, 7, 1, "#15161c");
    letter("M", x + 6, y - 3, "#fffdf6"); letter("F", x + 12, y - 3, "#fffdf6"); letter("G", x + 16, y - 3, "#fffdf6");
    if (m.id === "boss") { px(x + 10, y + 9, 4, 4, "#ff375f"); px(x + 21, y - 6, 2, 2, "#ffd60a"); }     // 팀장: 빨간 스카프, 모자 위 별
    if (m.id === "E") { px(x + 23, y + 1, 1, 10, "#c3cad1"); px(x + 22, y + 9, 3, 3, "#ff375f"); } // 온도계
    if (m.id === "C") { px(x - 6, y + 4, 6, 9, "#f4f1ea"); px(x - 4, y + 3, 2, 2, "#8a939c"); [6, 8, 10].forEach((yy) => px(x - 5, y + yy, 4, 1, "#a9a3b8")); } // 클립보드
    // 스테인리스 조리대 (다리를 가림)
    px(dx, dy, DW, 3, "#dfe4e9"); px(dx, dy + 3, DW, 10, "#b9c1c9"); px(dx, dy + 3, DW, 1, "#9aa3ac"); px(dx + 2, dy + 13, 3, 4, "#6b737c"); px(dx + DW - 5, dy + 13, 3, 4, "#6b737c");
    // 명패
    px(dx + 17, dy + 5, 9, 7, "#fffdf6");
    if (m.id === "boss") { px(dx + 19, dy + 7, 5, 2, "#ffd60a"); px(dx + 19, dy + 6, 1, 1, "#ffd60a"); px(dx + 21, dy + 6, 1, 1, "#ffd60a"); px(dx + 23, dy + 6, 1, 1, "#ffd60a"); px(dx + 19, dy + 9, 5, 1, "#ffd60a"); }
    else letter(m.id, dx + 20, dy + 6, "#1b1d2e");
    screen(m.screen, dx + 28, dy - 14, t);
    // 소스통 (빨강·노랑)
    px(dx + 40, dy - 6, 3, 6, i % 2 ? "#ffd60a" : "#ff375f"); px(dx + 41, dy - 8, 1, 2, "#fffdf6");
    // 팀장 자리: 패스 벨
    if (m.id === "boss") { px(dx + 1, dy - 3, 7, 3, "#ffd60a"); px(dx + 4, dy - 4, 1, 1, "#ffd60a"); }
    // 레시피 담당 자리: 냄비 김
    if (m.id === "B") { px(dx + 1, dy - 6, 9, 6, "#5f6770"); px(dx, dy - 6, 11, 1, "#8a939c"); const st = Math.floor(t / 250 + i) % 3; px(dx + 3 + st, dy - 9 - st, 1, 2, "#e6ebf0"); px(dx + 6 - st, dy - 11 + st, 1, 2, "#e6ebf0"); }
  }

  function frame(t) {
    room(t);
    TEAM.forEach((m, i) => member(m, i, t));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 실제 데이터 (구글 시트, 읽기만) ----------
  const API = "https://script.google.com/macros/s/AKfycbw56Q_Q3m0ZyZSHlAlRru2MZZ4-Lqj4tvfXFOfhH_YLi4HOiLn9Cj2yEbARK9LTk00t5Q/exec";
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const now = new Date(), TODAY = iso(now), YEST = iso(new Date(now - 864e5));
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const won = (v) => Math.round(v).toLocaleString("ko-KR");
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isFinite(n) ? n : NaN; };
  let db = {};
  try { db = JSON.parse(localStorage.getItem("order-calc-db")) || {}; } catch {}
  document.getElementById("bDate").textContent = `${TODAY.slice(5).replace("-", ".")} ${["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][now.getDay()]}`;

  const lines = () => {
    const f = db.forecast || {}, ft = f[TODAY] || {}, fy = f[YEST] || {};
    const inp = db["input." + TODAY] || {}, ins = Object.values(inp);
    const stock = ins.filter((r) => r && String(r.s ?? "") !== "").length, ordered = ins.filter((r) => r && num(r.o) > 0).length;
    const prep = Object.keys(db["prepOnhand." + TODAY] || {}).length;
    const ly = num(fy.act), fyv = num(fy.fc);
    const map = db.map || { menu: {}, ing: {} };
    const log = (db.learnlog || []).slice().sort((a, b) => (a.t < b.t ? 1 : -1))[0];
    const last = log && log.notes && log.notes[0] ? log.notes[0][1] : "아직 기록이 없어요";
    return {
      boss: isFinite(num(ft.fc)) ? `오늘 ${DOW[now.getDay()]}요일 Forecast ${won(num(ft.fc))}원. 이걸로 다들 계산해요!` : "오늘 Forecast가 아직 없어요. 데이터 예상으로 계산 중이에요.",
      A: isFinite(ly) ? `어제 실제 매출 ${won(ly)}원${isFinite(fyv) && fyv ? `, Forecast 대비 ${Math.round(ly / fyv * 100)}%` : ""}. 오차 기록했어요.` : "어제 실제 Gross가 비어 있어요. 넣어주시면 바로 채점할게요.",
      B: `메뉴 연결 ${Object.keys(map.menu || {}).length}개, 재료 연결 ${Object.keys(map.ing || {}).length}개 관리 중. 1TB 무게 알려주세요!`,
      C: `오늘 재고 ${stock}개 · 발주 ${ordered}개 · 프랩 재고 ${prep}개 들어왔어요. 이상한 숫자 찾는 중.`,
      D: "±는 칩 옆에, 합계만 초록·노랑·빨강. 1px도 안 놓쳐요.",
      E: `최근 학습 기록: ${last}`,
    };
  };
  const boardFc = () => { const v = num(((db.forecast || {})[TODAY] || {}).fc); document.getElementById("bFc").textContent = isFinite(v) ? `Forecast ${won(v)}` : "Forecast –"; };
  boardFc();
  fetch(API + "?api=1").then((r) => r.json()).then((d) => { db = { ...db, ...(d && d.data ? d.data : d) }; boardFc(); if (cur) say(cur, true); }).catch(() => {});

  // ---------- 말풍선 ----------
  const stage = document.getElementById("stage");
  let bubble = null, cur = null, auto = null;
  function say(id, keep) {
    cur = id;
    const m = TEAM.find((x) => x.id === id), p = pos[id]; if (!m || !p) return;
    if (!bubble) { bubble = document.createElement("div"); bubble.className = "bubble"; stage.appendChild(bubble); }
    bubble.innerHTML = `<small>${m.tag}</small>${lines()[id]}`;
    bubble.style.left = `${Math.min(70, Math.max(30, p.x / W * 100))}%`;
    bubble.style.top = `${(p.y - 1) / H * 100}%`;
    document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", c.dataset.id === id));
    if (!keep) { clearInterval(auto); auto = setInterval(next, 6000); }
  }
  const next = () => { const i = TEAM.findIndex((m) => m.id === cur); say(TEAM[(i + 1) % TEAM.length].id, true); };
  cv.addEventListener("click", (e) => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    const hit = TEAM.find((m) => { const [dx, dy] = m.desk; return x >= dx && x <= dx + 44 && y >= dy - 24 && y <= dy + 16; });
    if (hit) say(hit.id);
  });
  document.getElementById("team").innerHTML = TEAM.map((m) => `<div class="card${m.id === "boss" ? " boss" : ""}" data-id="${m.id}"><span class="tag">${m.tag}</span><b>${m.name}</b><span>${m.role}</span></div>`).join("");
  document.getElementById("team").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) say(c.dataset.id); });
  setTimeout(() => say("boss"), 400);
  auto = setInterval(next, 6000);
})();
</script>
</body>
</html>
