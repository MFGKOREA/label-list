<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글표시사항">
<meta name="theme-color" content="#13211b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5a46'/%3E%3Crect x='16' y='18' width='32' height='5' rx='2.5' fill='white'/%3E%3Crect x='16' y='30' width='24' height='5' rx='2.5' fill='white'/%3E%3Crect x='16' y='42' width='16' height='5' rx='2.5' fill='white'/%3E%3C/svg%3E">
<title>한글표시사항 리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark ink hero band (store, title, 3 status counts) → form card lifted over its edge → list.
   Ink green + brass, serif display for names, mono for dates. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #17211c;
  --muted: #727a74;
  --line: #e3e5e0;
  --ink: #13211b;          /* hero band, primary button */
  --ink-fg: #f1ece0;
  --ink-muted: #a9b2ab;
  --brass: #b08a4e;        /* accent */
  --brass-soft: #d8bf8f;
  --accent-ink: #f1ece0;
  --danger: #a8443a; --danger-bg: #f8ebe8; --danger-hi: #e58b7f;
  --warn: #93661c;   --warn-bg: #f8f0e0;   --warn-hi: #e2b867;
  --ok: #3f6f57;     --ok-bg: #e8f1ec;     --ok-hi: #9cc7ae;
  --shadow: 0 1px 2px rgb(19 33 27 / .05), 0 8px 24px rgb(19 33 27 / .07);
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1411; --surface: #151e1a; --fg: #e9ece8; --muted: #949d97; --line: #26312b;
    --ink: #0a110e; --ink-fg: #efe9dc; --ink-muted: #8f9a93; --brass: #c9a468; --brass-soft: #d8bf8f; --accent-ink: #14100a;
    --danger: #ec9a8f; --danger-bg: #36201d; --warn: #e6bd70; --warn-bg: #33291a; --ok: #9ccdb3; --ok-bg: #1a2b23;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1411; --surface: #151e1a; --fg: #e9ece8; --muted: #949d97; --line: #26312b;
  --ink: #0a110e; --ink-fg: #efe9dc; --ink-muted: #8f9a93; --brass: #c9a468; --brass-soft: #d8bf8f; --accent-ink: #14100a;
  --danger: #ec9a8f; --danger-bg: #36201d; --warn: #e6bd70; --warn-bg: #33291a; --ok: #9ccdb3; --ok-bg: #1a2b23;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-bottom: 56px; }
.gutter { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 680px; margin-left: auto; margin-right: auto; }

/* hero */
.hero { background: var(--ink); color: var(--ink-fg); padding-block: 30px 64px; }
.hero header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.store { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .18em; color: var(--brass-soft); margin-bottom: 8px; }
h1 { font-family: var(--font-display); font-size: 27px; font-weight: 600; margin: 0; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
.today { color: var(--ink-muted); font-size: 12.5px; font-family: var(--font-num); letter-spacing: .02em; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 26px; border-top: 1px solid rgb(255 255 255 / .12); }
.sum { display: grid; gap: 2px; padding: 16px 0 0; }
.sum + .sum { padding-left: 18px; border-left: 1px solid rgb(255 255 255 / .12); }
.sum b { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum span { font-size: 12px; color: var(--ink-muted); letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.sum span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
.sum.exp { --hi: var(--danger-hi); } .sum.soon { --hi: var(--warn-hi); } .sum.ok { --hi: var(--ok-hi); }
.sum b { color: var(--hi); }
.sum span::before { background: var(--hi); }

/* content */
.wrap { display: grid; gap: 22px; margin-top: -40px; }
form { background: var(--surface); border-radius: 18px; padding: 22px 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.row > * { min-width: 0; }
label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
input, select {
  font: inherit; font-size: 15px; color: var(--fg); background: transparent;
  border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 2px; width: 100%; min-width: 0;
}
input:focus-visible, select:focus-visible { outline: none; border-bottom-color: var(--brass); box-shadow: 0 1px 0 var(--brass); }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
.period { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
.preview { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.preview b { color: var(--fg); font-family: var(--font-num); font-weight: 500; }
.form-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-left: auto; }
.btn { white-space: nowrap; font: inherit; font-size: 14px; font-weight: 500; border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
.btn:hover { border-color: var(--brass); }
.btn.small { padding: 7px 12px; font-size: 13px; color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); font-weight: 600; padding-inline: 26px; }
.btn.primary:hover { background: var(--brass); border-color: var(--brass); color: var(--accent-ink); }
.btn:disabled { opacity: .6; cursor: progress; }

.listhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 6px; }
.listhead h2 { font-size: 12px; margin: 0; font-weight: 600; letter-spacing: .16em; color: var(--muted); }
.listhead h2 #total { letter-spacing: .04em; }
.listhead input { max-width: 180px; font-size: 13px; padding: 6px 2px; }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
li { display: grid; grid-template-columns: 66px 1fr auto; gap: 14px; align-items: center; padding: 15px 18px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.dday { font-family: var(--font-num); font-size: 12.5px; font-weight: 500; text-align: center; border-radius: 999px; padding: 5px 0; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.dday.exp { background: var(--danger-bg); color: var(--danger); }
.dday.soon { background: var(--warn-bg); color: var(--warn); }
.dday.ok { background: var(--ok-bg); color: var(--ok); }
.info { min-width: 0; display: flex; align-items: center; gap: 12px; }
.txt { min-width: 0; }
.name { font-family: var(--font-display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; }
.meta .date { font-family: var(--font-num); color: var(--fg); }
li.expired .name { text-decoration: line-through; text-decoration-color: var(--muted); }
.ops { display: flex; gap: 2px; }
.ops button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--muted); padding: 6px 9px; border-radius: 999px; cursor: pointer; }
.ops button:hover { background: var(--bg); color: var(--fg); }
.ops button.confirm { color: var(--danger); font-weight: 600; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.note { font-size: 12px; color: var(--muted); text-align: center; }
.reset { display: flex; justify-content: center; padding-top: 14px; }
.reset-open { font: inherit; font-size: 13px; font-weight: 600; color: var(--danger); background: none; border: 0; cursor: pointer; padding: 8px 12px; border-radius: 999px; }
.reset-open:hover { background: var(--danger-bg); }
.reset-text { margin: 0; font-size: 14px; color: var(--muted); }
.reset-text b { color: var(--fg); }
.reset-msg { font-size: 13px; color: var(--danger); }
.reset-msg:empty { display: none; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.btn.danger:hover { background: var(--danger); border-color: var(--danger); filter: brightness(1.08); }

/* popups */
.overlay { position: fixed; inset: 0; background: rgb(8 14 11 / .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.popup { background: var(--surface); color: var(--fg); border-radius: 20px; width: 100%; max-width: 420px; max-height: 82vh; overflow: auto; padding: 24px 20px 20px; display: grid; gap: 16px; box-shadow: 0 20px 50px rgb(0 0 0 / .3); }
.popup h3 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.popup ul { border-radius: 14px; box-shadow: none; border: 1px solid var(--line); }
.alert-body { display: grid; gap: 8px; }
.grp { margin: 8px 0 0; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; display: flex; align-items: center; gap: 6px; }
.grp::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.grp:first-child { margin-top: 0; }
.grp.exp { color: var(--danger); }
.grp.soon { color: var(--warn); }
.popup li { grid-template-columns: 62px 1fr; padding: 12px 14px; }
.popup .actions { justify-content: stretch; margin-left: 0; flex-wrap: nowrap; }
.popup .actions .btn { flex: 1; }

@media (max-width: 480px) {
  h1 { font-size: 24px; }
  .row { grid-template-columns: 1fr; }
  li { grid-template-columns: 58px 1fr; padding: 14px 16px; }
  .ops { grid-column: 2; margin-left: -9px; }
  .listhead input { max-width: 130px; }
  .sum + .sum { padding-left: 14px; }
  .sum b { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .ops button, .seg button { transition: background-color .15s, color .15s, border-color .15s; }
}
</style>
</head>
<body>
<section class="hero gutter">
  <div class="inner">
    <header>
      <div>
        <span class="store" id="storeName">MG수원컨벤션점</span>
        <h1>한글표시사항 리스트</h1>
      </div>
      <div class="today" id="today"></div>
    </header>
    <div class="summary">
      <div class="sum exp"><b id="cExp">0</b><span>7일 이내</span></div>
      <div class="sum soon"><b id="cSoon">0</b><span>30일 이내</span></div>
      <div class="sum ok"><b id="cOk">0</b><span>여유</span></div>
    </div>
  </div>
</section>

<div class="wrap inner gutter">

  <form id="form" autocomplete="off">
    <div class="row">
      <label>제품명
        <input id="fName" required placeholder="예: 냉동 새우살 500g">
      </label>
      <label>특이사항 (선택)
        <input id="fMemo" placeholder="예: 냉동보관 / 개봉 후 냉장">
      </label>
    </div>
    <div class="seg" role="group" aria-label="기한 입력 방식">
      <button type="button" id="mDate" aria-pressed="true">유통기한 직접 입력</button>
      <button type="button" id="mPeriod" aria-pressed="false">제조일로부터 기간</button>
    </div>
    <div class="row" id="byDate">
      <label>유통기한
        <input type="date" id="fExpiry">
      </label>
    </div>
    <div class="row" id="byPeriod" hidden>
      <label>제조일자
        <input type="date" id="fMfg">
      </label>
      <label>제조일로부터
        <span class="period">
          <input type="number" id="fNum" min="1" step="1" value="3" inputmode="numeric">
          <select id="fUnit">
            <option value="y">년</option>
            <option value="m">개월</option>
            <option value="d">일</option>
          </select>
        </span>
      </label>
    </div>
    <div class="preview" id="preview"></div>
    <div class="form-foot">
      <div class="actions">
        <button type="button" class="btn" id="cancel" hidden>취소</button>
        <button type="submit" class="btn primary" id="submit">추가</button>
      </div>
    </div>
  </form>

  <div class="listhead">
    <h2>기한 짧은 순 <span id="total"></span></h2>
    <input id="q" type="search" placeholder="검색">
  </div>
  <ul id="list" hidden></ul>
  <div class="empty" id="empty">아직 등록된 제품이 없습니다. 위에서 제품명과 유통기한을 입력해 추가하세요.</div>
  <div class="note" id="note"></div>

  <div class="reset" id="resetZone">
    <button type="button" class="reset-open" id="resetOpen">초기화</button>
  </div>
</div>

<div class="overlay" id="resetBox" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <h3 id="resetTitle">품목을 모두 지울까요?</h3>
    <p class="reset-text"><b id="resetStore"></b>의 품목이 모두 지워지고 되돌릴 수 없습니다.</p>
    <div class="reset-msg" id="resetMsg"></div>
    <div class="actions">
      <button type="button" class="btn" id="resetCancel">취소</button>
      <button type="button" class="btn danger" id="resetGo">초기화</button>
    </div>
  </div>
</div>


<div class="overlay" id="alert" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="alertTitle">
    <h3 id="alertTitle"></h3>
    <div id="alertBody" class="alert-body"></div>
    <div class="actions">
      <button type="button" class="btn" id="alertToday">오늘 하루 안 보기</button>
      <button type="button" class="btn primary" id="alertClose">확인</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const UNIT = { y: "년", m: "개월", d: "일" };
  let items = [];
  let mode = "date";
  let editId = null;
  let pendingDelete = null;

  // ---- date helpers (local dates as YYYY-MM-DD) ----
  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = (s) => s ? s.replaceAll("-", ".") : "";
  function addPeriod(mfg, num, unit) {
    const d = parse(mfg);
    if (unit === "d") return toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate() + num));
    const months = unit === "y" ? num * 12 : num;
    const target = new Date(d.getFullYear(), d.getMonth() + months, 1);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(d.getDate(), last));
    return toISO(target);
  }
  const expiryOf = (it) => it.mode === "period" ? addPeriod(it.mfg, it.num, it.unit) : it.expiry;
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const daysLeft = (iso) => Math.round((parse(iso) - today()) / DAY);
  const status = (n) => n <= 7 ? "exp" : n <= 30 ? "soon" : "ok"; // 7일 이내(지난 것 포함) / 30일 이내 / 여유
  const ddayText = (n) => n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${-n}`;

  // ---- storage: Google Sheet via Apps Script API, localStorage as a fast first paint ----
  // ---- 매장: 링크 끝 ?store=코드 로 구분. 코드 없이 열면 수원컨벤션점 ----
  // 매장마다 구글 프로젝트(웹 앱 /exec 주소)가 따로 있습니다. 매장을 늘릴 때는 아래에 한 줄 추가.
  const STORES = {
    suwon: { name: "MG수원컨벤션점", api: "https://script.google.com/macros/s/AKfycbyPJbVBORKgT-X7ZzyROdnLtK1zRMxPhNPBEqo_UNX2usdGy6YavPyWAduqwdNsaFo/exec" },
    lwt: { name: "MG롯데시네마월드타워점", api: "https://script.google.com/macros/s/AKfycbzxRVdyf02wbFZVRRif34GJXUZl70hoebw8__46aoyfr_lvZQT-1N_76H6prSpHdgnH/exec" },
  };
  const STORE = new URLSearchParams(location.search).get("store") || "suwon";
  const storeKnown = Object.prototype.hasOwnProperty.call(STORES, STORE);
  $("storeName").textContent = storeKnown ? STORES[STORE].name : "등록되지 않은 매장";
  document.title = (storeKnown ? STORES[STORE].name + " · " : "") + "한글표시사항 리스트";

  const LS = "label-list-items-v2-" + STORE; // 새 프로젝트로 옮기며 캐시 이름 변경
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(items)); } catch {} }
  const API = storeKnown ? STORES[STORE].api : "";
  async function call(fn, arg) {
    const body = fn === "saveItem" ? { action: "save", item: arg, store: STORE }
      : fn === "deleteItem" ? { action: "delete", id: arg, store: STORE }
      : { action: "clear", store: STORE };
    const res = fn === "listItems"
      ? await fetch(API + "?api=1&store=" + encodeURIComponent(STORE) + "&t=" + Date.now())
      : await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body),
        });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || data.error || !Array.isArray(data)) throw new Error(data && data.error || "응답 오류");
    return data;
  }

  function apply(list) { items = list; lsSave(); render(); $("note").textContent = ""; showAlertOnce(); }

  // ---- 기한 임박 팝업: 앱을 열고 목록을 처음 받아왔을 때 한 번 (7일 이내 / 30일 이내) ----
  const SKIP = "label-list-alert-skip" + (STORE === "suwon" ? "" : "-" + STORE);
  let alertShown = false;
  function alertRow({ it, exp, n }) {
    return `<li><div class="dday ${status(n)}">${ddayText(n)}</div>
      <div class="info"><div class="txt"><div class="name">${esc(it.name)}</div>
        <div class="meta"><span>유통기한 <span class="date">${fmt(exp)}</span></span>${it.memo ? `<span>${esc(it.memo)}</span>` : ""}</div></div></div></li>`;
  }
  function showAlertOnce() {
    if (alertShown) return;
    alertShown = true;
    try { if (localStorage.getItem(SKIP) === toISO(today())) return; } catch {}
    const rows = items.map((it) => { const exp = expiryOf(it); return { it, exp, n: daysLeft(exp) }; })
      .filter((r) => r.n <= 30).sort((a, b) => a.n - b.n);
    if (!rows.length) return;
    const week = rows.filter((r) => r.n <= 7), month = rows.filter((r) => r.n > 7);
    $("alertTitle").textContent = `유통기한 확인할 품목 ${rows.length}개`;
    $("alertBody").innerHTML =
      (week.length ? `<h4 class="grp exp">7일 이내 · ${week.length}개</h4><ul>${week.map(alertRow).join("")}</ul>` : "") +
      (month.length ? `<h4 class="grp soon">30일 이내 · ${month.length}개</h4><ul>${month.map(alertRow).join("")}</ul>` : "");
    $("alert").hidden = false;
    $("alertClose").focus();
  }
  const closeAlert = () => { $("alert").hidden = true; };
  $("alertClose").onclick = closeAlert;
  $("alertToday").onclick = () => { try { localStorage.setItem(SKIP, toISO(today())); } catch {} closeAlert(); };
  $("alert").addEventListener("click", (e) => { if (e.target.id === "alert") closeAlert(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeAlert(); $("resetBox").hidden = true; } });

  async function save(it) {
    const i = items.findIndex((x) => x.id === it.id); i >= 0 ? items[i] = it : items.push(it); render();
    apply(await call("saveItem", it));
  }
  async function remove(id) {
    items = items.filter((x) => x.id !== id); render();
    apply(await call("deleteItem", id));
  }
  async function refresh() {
    if (document.hidden || editId) return;
    try { apply(await call("listItems")); }
    catch { $("note").textContent = "목록을 불러오지 못했습니다. 인터넷 연결을 확인하세요."; }
  }

  // ---- form ----
  function setMode(m) {
    mode = m;
    $("mDate").setAttribute("aria-pressed", m === "date");
    $("mPeriod").setAttribute("aria-pressed", m === "period");
    $("byDate").hidden = m !== "date";
    $("byPeriod").hidden = m !== "period";
    updatePreview();
  }
  function readForm() {
    const it = { name: $("fName").value.trim(), memo: $("fMemo").value.trim(), mode };
    if (mode === "date") { if (!$("fExpiry").value) return null; it.expiry = $("fExpiry").value; }
    else {
      const num = parseInt($("fNum").value, 10);
      if (!$("fMfg").value || !(num > 0)) return null;
      Object.assign(it, { mfg: $("fMfg").value, num, unit: $("fUnit").value });
    }
    return it;
  }
  function updatePreview() {
    const it = readForm();
    if (!it) { $("preview").textContent = mode === "date" ? "유통기한 날짜를 선택하세요." : "제조일자와 기간을 입력하면 유통기한이 계산됩니다."; return; }
    const exp = expiryOf(it), n = daysLeft(exp);
    $("preview").innerHTML = `유통기한 <b>${fmt(exp)}</b> · ${n < 0 ? `${-n}일 지남` : n === 0 ? "오늘까지" : `${n}일 남음`}`;
  }
  function resetForm() {
    editId = null;
    $("form").reset();
    $("fNum").value = 3;
    $("submit").textContent = "추가";
    $("cancel").hidden = true;
    setMode(mode);
  }
  function startEdit(it) {
    editId = it.id;
    $("fName").value = it.name; $("fMemo").value = it.memo || "";
    if (it.mode === "period") { $("fMfg").value = it.mfg; $("fNum").value = it.num; $("fUnit").value = it.unit; }
    else $("fExpiry").value = it.expiry;
    setMode(it.mode);
    $("submit").textContent = "수정 저장";
    $("cancel").hidden = false;
    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
    $("fName").focus({ preventScroll: true });
  }

  $("mDate").onclick = () => setMode("date");
  $("mPeriod").onclick = () => setMode("period");
  $("form").addEventListener("input", updatePreview);
  $("cancel").onclick = resetForm;
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const it = readForm();
    if (!it || !it.name) { updatePreview(); if (!it?.name) $("fName").focus(); return; }
    it.id = editId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    it.updatedAt = Date.now();
    $("submit").disabled = true;
    try {
      await save(it); resetForm(); $("fName").focus();
    }
    catch { $("preview").textContent = "저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."; }
    finally { $("submit").disabled = false; }
  });
  $("q").addEventListener("input", render);

  // ---- render ----
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function render() {
    const rows = items.map((it) => { const exp = expiryOf(it); return { it, exp, n: daysLeft(exp) }; })
      .sort((a, b) => a.n - b.n || a.it.name.localeCompare(b.it.name, "ko"));
    const c = { exp: 0, soon: 0, ok: 0 };
    rows.forEach((r) => c[status(r.n)]++);
    $("cExp").textContent = c.exp; $("cSoon").textContent = c.soon; $("cOk").textContent = c.ok;
    $("total").textContent = rows.length ? `· ${rows.length}개` : "";

    const q = $("q").value.trim().toLowerCase();
    const shown = q ? rows.filter((r) => (r.it.name + " " + (r.it.memo || "")).toLowerCase().includes(q)) : rows;
    $("list").hidden = !shown.length;
    $("empty").hidden = !!shown.length;
    $("empty").textContent = rows.length ? "검색 결과가 없습니다." : "아직 등록된 제품이 없습니다. 위에서 제품명과 유통기한을 입력해 추가하세요.";

    $("list").innerHTML = shown.map(({ it, exp, n }) => {
      const s = status(n);
      const basis = it.mode === "period" ? `<span>제조 ${fmt(it.mfg)} + ${it.num}${UNIT[it.unit]}</span>` : "";
      const memo = it.memo ? `<span>${esc(it.memo)}</span>` : "";
      const del = pendingDelete === it.id
        ? `<button class="confirm" data-act="del" data-id="${it.id}">삭제 확인</button><button data-act="keep">취소</button>`
        : `<button data-act="edit" data-id="${it.id}">수정</button><button data-act="ask" data-id="${it.id}">삭제</button>`;
      return `<li class="${n < 0 ? "expired" : ""}">
        <div class="dday ${s}">${ddayText(n)}</div>
        <div class="info"><div class="txt"><div class="name">${esc(it.name)}</div>
          <div class="meta"><span>유통기한 <span class="date">${fmt(exp)}</span></span>${basis}${memo}</div></div></div>
        <div class="ops">${del}</div></li>`;
    }).join("");
  }
  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "edit") startEdit(items.find((x) => x.id === id));
    else if (act === "ask") { pendingDelete = id; render(); }
    else if (act === "keep") { pendingDelete = null; render(); }
    else if (act === "del") { pendingDelete = null; if (editId === id) resetForm(); try { await remove(id); } catch { refresh(); } }
  });

  // ---- boot ----
  const t = today();
  $("today").textContent = `오늘 ${fmt(toISO(t))} (${"일월화수목금토"[t.getDay()]})`;
  $("fExpiry").value = ""; setMode("date");
  items = lsLoad(); render();

  // ---- 매장 품목 전체 초기화 (확인창) ----
  $("resetStore").textContent = storeKnown ? STORES[STORE].name : "";
  const closeReset = () => { $("resetBox").hidden = true; $("resetMsg").textContent = ""; $("resetGo").disabled = false; };
  $("resetOpen").onclick = () => { $("resetBox").hidden = false; $("resetCancel").focus(); };
  $("resetCancel").onclick = closeReset;
  $("resetBox").addEventListener("click", (e) => { if (e.target.id === "resetBox") closeReset(); });
  $("resetGo").onclick = async () => {
    $("resetGo").disabled = true; $("resetMsg").textContent = "";
    $("resetGo").textContent = "지우는 중…";
    try { apply(await call("clearItems")); resetForm(); closeReset(); $("note").textContent = "품목을 모두 지웠습니다."; }
    catch { $("resetMsg").textContent = "지우지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."; $("resetGo").disabled = false; }
    finally { $("resetGo").textContent = "초기화"; }
  };

  if (!storeKnown) {
    $("resetZone").hidden = true;
    $("form").hidden = true; $("list").hidden = true;
    $("empty").textContent = "등록되지 않은 매장 링크입니다. 받은 링크를 다시 확인해 주세요.";
    return;
  }
  refresh();
  setInterval(refresh, 20000);
  document.addEventListener("visibilitychange", refresh);
})();
</script>
</body>
</html>
