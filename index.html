<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글표시사항">
<meta name="theme-color" content="#f4f4f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5a46'/%3E%3Crect x='16' y='18' width='32' height='5' rx='2.5' fill='white'/%3E%3Crect x='16' y='30' width='24' height='5' rx='2.5' fill='white'/%3E%3Crect x='16' y='42' width='16' height='5' rx='2.5' fill='white'/%3E%3C/svg%3E">
<title>한글표시사항 리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* MG 코랄 테마 (발주량 계산기와 동일): 연회색 바탕 · 둥근 흰 카드 · 먹색 버튼 · 코랄 포인트 · 초록 '여유' */
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --fill: rgba(0, 0, 0, .05);
  --fg: #222222;
  --muted: #8b8b8b;
  --line: #ebebeb;
  --accent: #222222;
  --accent-ink: #ffffff;
  --rose: #fdeeec; --rose-ink: #ef6253;
  --amber: #fff3e0; --amber-ink: #e08a1e;
  --ok-bg: #ebf7f0; --ok: #41b979;
  --font: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #141414; --fill: rgba(255, 255, 255, .08); --fg: #f2f2f2; --muted: #8b8b8b; --line: #262626;
    --accent: #f2f2f2; --accent-ink: #000000;
    --rose: #2c1614; --rose-ink: #ff7b6d; --amber: #2b2010; --amber-ink: #f0a94a; --ok-bg: #10261b; --ok: #4cc38a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #141414; --fill: rgba(255, 255, 255, .08); --fg: #f2f2f2; --muted: #8b8b8b; --line: #262626;
  --accent: #f2f2f2; --accent-ink: #000000;
  --rose: #2c1614; --rose-ink: #ff7b6d; --amber: #2b2010; --amber-ink: #f0a94a; --ok-bg: #10261b; --ok: #4cc38a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45;
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 22px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.store { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin: 2px 2px 4px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; }
.today { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; background: var(--surface); border-radius: 12px; padding: 6px 13px; white-space: nowrap; }

/* summary tiles */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sum { background: var(--surface); border-radius: 18px; padding: 14px 14px 12px; display: flex; flex-direction: column-reverse; gap: 4px; }
.sum span { font-size: 13px; color: var(--muted); font-weight: 500; }
.sum b { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.sum b::after { content: "개"; font-size: 15px; font-weight: 700; margin-left: 1px; }
.sum.exp b { color: var(--rose-ink); }
.sum.soon b { color: var(--amber-ink); }
.sum.ok b { color: var(--ok); }

/* form */
form { background: var(--surface); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.row > * { min-width: 0; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
input, select { font: inherit; font-size: 16px; font-weight: 600; color: var(--fg); background: var(--fill); border: 0; border-radius: 11px; padding: 11px 12px; width: 100%; min-width: 0; }
input::placeholder { color: var(--muted); font-weight: 500; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--fg); outline-offset: 0; }
button:focus-visible { outline: 2px solid var(--rose-ink); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 11px; padding: 2px; }
.seg button { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 9px 10px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
.period { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
.by-date { display: grid; gap: 8px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.quick button { font: inherit; font-size: 14px; font-weight: 700; border: 0; border-radius: 10px; padding: 9px 0; background: var(--fill); color: var(--fg); cursor: pointer; }
.quick button.on { background: var(--accent); color: var(--accent-ink); }
.todaybar { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: grid; gap: 12px; }
.need { display: grid; gap: 10px; }
.notice { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.nt-head { display: flex; align-items: baseline; gap: 8px; }
.nt-time { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
.nt-time.err { color: var(--rose-ink); }
.notice textarea { font: inherit; font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--fg); background: var(--fill); border: 0; border-radius: 11px; padding: 10px 12px; resize: none; width: 100%; min-height: 64px; overflow: hidden; }
.notice textarea::placeholder { color: var(--muted); font-weight: 500; font-size: 14px; }
.notice textarea:focus-visible { outline: 2px solid var(--fg); }
.tb-head { display: flex; align-items: baseline; gap: 6px; }
.todaybar .t { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.todaybar .cnt { font-size: 16px; font-weight: 800; color: var(--rose-ink); }
.tb-list { display: flex; flex-wrap: wrap; gap: 6px; }
.todaybar .c { font-size: 13px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: var(--fill); color: var(--fg); }
.todaybar .c b { font-weight: 800; margin-left: 2px; }
.todaybar .c.hot b { color: var(--rose-ink); }
.todaybar .c.warm b { color: var(--amber-ink); }
.todaybar .none { font-size: 14px; color: var(--muted); font-weight: 600; }
.add-open { font: inherit; font-size: 17px; font-weight: 800; border: 0; border-radius: 16px; padding: 16px; background: var(--accent); color: var(--accent-ink); cursor: pointer; letter-spacing: -0.02em; }
.form-top { display: flex; justify-content: space-between; align-items: center; }
.form-top b { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.form-close { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: var(--fill); color: var(--muted); border-radius: 9px; padding: 6px 12px; cursor: pointer; }
.name-hint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--muted); }
.name-hint .dup { color: var(--rose-ink); }
.preview { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.preview b { color: var(--fg); font-weight: 700; }
.form-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-left: auto; }
.btn { white-space: nowrap; font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 11px; padding: 11px 18px; cursor: pointer; background: var(--fill); color: var(--fg); }
.btn.small { padding: 8px 12px; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); padding-inline: 26px; }
.btn:disabled { opacity: .5; cursor: progress; }

/* list */
.listhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; padding: 0 2px; }
.listhead h2 { font-size: 15px; margin: 0; font-weight: 700; color: var(--muted); }
.listhead h2 #total { font-weight: 500; }
.listhead input { max-width: 170px; font-size: 14px; padding: 8px 12px; background: var(--surface); }
ul { list-style: none; margin: 0; padding: 0 0 0 18px; background: var(--surface); border-radius: 20px; overflow: hidden; }
li { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 15px 18px 15px 0; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.dday { font-size: 13px; font-weight: 800; text-align: center; border-radius: 8px; padding: 6px 0; letter-spacing: -0.01em; }
.dday.exp { background: var(--rose); color: var(--rose-ink); }
.dday.soon { background: var(--amber); color: var(--amber-ink); }
.dday.ok { background: var(--ok-bg); color: var(--ok); }
.info { min-width: 0; display: flex; align-items: center; gap: 12px; }
.txt { min-width: 0; }
.name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; }
.meta .date { color: var(--fg); font-weight: 600; }
li.expired .name { text-decoration: line-through; text-decoration-color: var(--muted); }
.ops { display: flex; gap: 4px; }
.ops button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: var(--fill); color: var(--fg); padding: 6px 11px; border-radius: 9px; cursor: pointer; }
.ops button.confirm { background: var(--rose); color: var(--rose-ink); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--surface); border-radius: 20px; }
.note { font-size: 12px; color: var(--muted); text-align: center; }
.reset { display: flex; justify-content: center; padding-top: 12px; }
.reset-open { font: inherit; font-size: 14px; font-weight: 700; color: var(--rose-ink); background: none; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 10px; }
.reset-open:hover { background: var(--rose); }
.reset-text { margin: 0; font-size: 14px; color: var(--muted); }
.reset-text b { color: var(--fg); }
.reset-msg { font-size: 13px; color: var(--rose-ink); }
.reset-msg:empty { display: none; }
.btn.danger { background: var(--rose-ink); color: #fff; }

/* popups */
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .4); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.popup { background: var(--surface); color: var(--fg); border-radius: 22px; width: 100%; max-width: 420px; max-height: 82vh; overflow: auto; padding: 22px 18px 18px; display: grid; gap: 14px; }
.popup h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
.popup ul { padding-left: 14px; border-radius: 14px; background: var(--fill); }
.popup li { grid-template-columns: 60px 1fr; padding: 12px 14px 12px 0; }
.alert-body { display: grid; gap: 8px; }
.grp { margin: 6px 2px 0; font-size: 14px; font-weight: 800; }
.grp:first-child { margin-top: 0; }
.grp.exp { color: var(--rose-ink); }
.grp.soon { color: var(--amber-ink); }
.popup .actions { justify-content: stretch; margin-left: 0; flex-wrap: nowrap; }
.popup .actions .btn { flex: 1; }

@media (max-width: 480px) {
  h1 { font-size: 27px; }
  .row { grid-template-columns: 1fr; }
  li { grid-template-columns: 58px 1fr; }
  .ops { grid-column: 2; }
  .sum b { font-size: 24px; }
  .listhead input { max-width: 130px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="store" id="storeName">MG수원컨벤션점</span>
  </div>
  <header class="hdr">
    <h1>한글표시사항 리스트</h1>
    <div class="today" id="today"></div>
  </header>
  <div class="summary">
    <div class="sum exp"><b id="cExp">0</b><span>7일 이내</span></div>
    <div class="sum soon"><b id="cSoon">0</b><span>30일 이내</span></div>
    <div class="sum ok"><b id="cOk">0</b><span>여유</span></div>
  </div>

  <div class="todaybar" id="todayBar">
    <div class="notice" id="notice">
      <div class="nt-head"><span class="t">전달사항</span><span class="nt-time" id="noticeTime"></span></div>
      <textarea id="noticeInput" rows="2" maxlength="200" placeholder="바로 적으면 자동 저장돼요 (예: 생크림 내일 입고)"></textarea>
    </div>
    <div class="need" id="needBox"></div>
  </div>

  <button type="button" class="add-open" id="addOpen">+ 품목 추가</button>


  <form id="form" autocomplete="off" hidden>
    <div class="form-top"><b id="formTitle">품목 추가</b><button type="button" class="form-close" id="formClose" aria-label="닫기">닫기</button></div>
    <div class="row">
      <label>제품명
        <input id="fName" required placeholder="예: 냉동 새우살 500g" list="nameList">
        <datalist id="nameList"></datalist>
        <span class="name-hint" id="nameHint" hidden></span>
      </label>
      <label>특이사항 (선택)
        <input id="fMemo" placeholder="예: 냉동보관 / 개봉 후 냉장">
      </label>
    </div>
    <div class="seg" role="group" aria-label="기한 입력 방식">
      <button type="button" id="mDate" aria-pressed="true">유통기한 직접 입력</button>
      <button type="button" id="mPeriod" aria-pressed="false">제조일로부터 기간</button>
    </div>
    <div class="by-date" id="byDate">
      <label>유통기한
        <input type="date" id="fExpiry">
      </label>
      <div class="quick" role="group" aria-label="오늘부터 빠른 입력">
        <button type="button" data-add="3d">+3일</button>
        <button type="button" data-add="7d">+7일</button>
        <button type="button" data-add="1m">+1개월</button>
        <button type="button" data-add="3m">+3개월</button>
      </div>
    </div>
    <div class="row" id="byPeriod" hidden>
      <label>제조일자
        <input type="date" id="fMfg">
      </label>
      <label>제조일로부터
        <span class="period">
          <input type="number" id="fNum" min="1" step="1" value="3" inputmode="numeric">
          <select id="fUnit">
            <option value="y">년</option>
            <option value="m">개월</option>
            <option value="d">일</option>
          </select>
        </span>
      </label>
    </div>
    <div class="preview" id="preview"></div>
    <div class="form-foot">
      <div class="actions">
        <button type="button" class="btn" id="cancel" hidden>취소</button>
        <button type="submit" class="btn primary" id="submit">추가</button>
      </div>
    </div>
  </form>

  <div class="listhead">
    <h2>기한 짧은 순 <span id="total"></span></h2>
    <input id="q" type="search" placeholder="검색">
  </div>
  <ul id="list" hidden></ul>
  <div class="empty" id="empty">아직 등록된 제품이 없습니다. 위에서 제품명과 유통기한을 입력해 추가하세요.</div>
  <div class="note" id="note"></div>

  <div class="reset" id="resetZone">
    <button type="button" class="reset-open" id="resetOpen">초기화</button>
  </div>
</div>

<div class="overlay" id="resetBox" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <h3 id="resetTitle">품목을 모두 지울까요?</h3>
    <p class="reset-text"><b id="resetStore"></b>의 품목이 모두 지워지고 되돌릴 수 없습니다.</p>
    <div class="reset-msg" id="resetMsg"></div>
    <div class="actions">
      <button type="button" class="btn" id="resetCancel">취소</button>
      <button type="button" class="btn danger" id="resetGo">초기화</button>
    </div>
  </div>
</div>


<div class="overlay" id="alert" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="alertTitle">
    <h3 id="alertTitle"></h3>
    <div id="alertBody" class="alert-body"></div>
    <div class="actions">
      <button type="button" class="btn" id="alertToday">오늘 하루 안 보기</button>
      <button type="button" class="btn primary" id="alertClose">확인</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const UNIT = { y: "년", m: "개월", d: "일" };
  let items = [];
  let mode = "date";
  let editId = null;
  let pendingDelete = null;

  // ---- date helpers (local dates as YYYY-MM-DD) ----
  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = (s) => s ? s.replaceAll("-", ".") : "";
  function addPeriod(mfg, num, unit) {
    const d = parse(mfg);
    if (unit === "d") return toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate() + num));
    const months = unit === "y" ? num * 12 : num;
    const target = new Date(d.getFullYear(), d.getMonth() + months, 1);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(d.getDate(), last));
    return toISO(target);
  }
  const expiryOf = (it) => it.mode === "period" ? addPeriod(it.mfg, it.num, it.unit) : it.expiry;
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const daysLeft = (iso) => Math.round((parse(iso) - today()) / DAY);
  const status = (n) => n <= 7 ? "exp" : n <= 30 ? "soon" : "ok"; // 7일 이내(지난 것 포함) / 30일 이내 / 여유
  const ddayText = (n) => n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${-n}`;

  // ---- storage: Google Sheet via Apps Script API, localStorage as a fast first paint ----
  // ---- 매장: 링크 끝 ?store=코드 로 구분. 코드 없이 열면 수원컨벤션점 ----
  // 매장마다 구글 프로젝트(웹 앱 /exec 주소)가 따로 있습니다. 매장을 늘릴 때는 아래에 한 줄 추가.
  const STORES = {
    suwon: { name: "MG수원컨벤션점", api: "https://script.google.com/macros/s/AKfycbyPJbVBORKgT-X7ZzyROdnLtK1zRMxPhNPBEqo_UNX2usdGy6YavPyWAduqwdNsaFo/exec" },
    lwt: { name: "MG롯데시네마월드타워점", api: "https://script.google.com/macros/s/AKfycbzxRVdyf02wbFZVRRif34GJXUZl70hoebw8__46aoyfr_lvZQT-1N_76H6prSpHdgnH/exec" },
  };
  const STORE = new URLSearchParams(location.search).get("store") || "suwon";
  const storeKnown = Object.prototype.hasOwnProperty.call(STORES, STORE);
  $("storeName").textContent = storeKnown ? STORES[STORE].name : "등록되지 않은 매장";
  document.title = (storeKnown ? STORES[STORE].name + " · " : "") + "한글표시사항 리스트";

  const LS = "label-list-items-v2-" + STORE; // 새 프로젝트로 옮기며 캐시 이름 변경
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } }
  const API = storeKnown ? STORES[STORE].api : "";
  async function call(fn, arg) {
    const body = fn === "saveItem" ? { action: "save", item: arg, store: STORE }
      : fn === "deleteItem" ? { action: "delete", id: arg, store: STORE }
      : { action: "clear", store: STORE };
    const res = fn === "listItems"
      ? await fetch(API + "?api=1&store=" + encodeURIComponent(STORE) + "&t=" + Date.now())
      : await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body),
        });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || data.error || !Array.isArray(data)) throw new Error(data && data.error || "응답 오류");
    return data;
  }

  // 전달사항은 품목 시트에 id "__notice__" 한 줄로 저장 (구글 코드 수정 없이 공유)
  const NOTICE_ID = "__notice__";
  let notice = null, noticeTimer = null, noticeDirty = false;
  function setData(list) {
    notice = list.find((x) => x.id === NOTICE_ID) || null;
    items = list.filter((x) => x.id !== NOTICE_ID && x.mode !== "note");
    renderNotice();
  }
  function apply(list) { setData(list); try { localStorage.setItem(LS, JSON.stringify(list)); } catch {} render(); $("note").textContent = ""; showAlertOnce(); }

  // ---- 기한 임박 팝업: 앱을 열고 목록을 처음 받아왔을 때 한 번 (7일 이내 / 30일 이내) ----
  const SKIP = "label-list-alert-skip" + (STORE === "suwon" ? "" : "-" + STORE);
  let alertShown = false;
  function alertRow({ it, exp, n }) {
    return `<li><div class="dday ${status(n)}">${ddayText(n)}</div>
      <div class="info"><div class="txt"><div class="name">${esc(it.name)}</div>
        <div class="meta"><span>유통기한 <span class="date">${fmt(exp)}</span></span>${it.memo ? `<span>${esc(it.memo)}</span>` : ""}</div></div></div></li>`;
  }
  function showAlertOnce() {
    if (alertShown) return;
    alertShown = true;
    try { if (localStorage.getItem(SKIP) === toISO(today())) return; } catch {}
    const rows = items.map((it) => { const exp = expiryOf(it); return { it, exp, n: daysLeft(exp) }; })
      .filter((r) => r.n <= 30).sort((a, b) => a.n - b.n);
    if (!rows.length) return;
    const week = rows.filter((r) => r.n <= 7), month = rows.filter((r) => r.n > 7);
    $("alertTitle").textContent = `유통기한 확인할 품목 ${rows.length}개`;
    $("alertBody").innerHTML =
      (week.length ? `<h4 class="grp exp">7일 이내 · ${week.length}개</h4><ul>${week.map(alertRow).join("")}</ul>` : "") +
      (month.length ? `<h4 class="grp soon">30일 이내 · ${month.length}개</h4><ul>${month.map(alertRow).join("")}</ul>` : "");
    $("alert").hidden = false;
    $("alertClose").focus();
  }
  const closeAlert = () => { $("alert").hidden = true; };
  $("alertClose").onclick = closeAlert;
  $("alertToday").onclick = () => { try { localStorage.setItem(SKIP, toISO(today())); } catch {} closeAlert(); };
  $("alert").addEventListener("click", (e) => { if (e.target.id === "alert") closeAlert(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeAlert(); $("resetBox").hidden = true; } });

  async function save(it) {
    const i = items.findIndex((x) => x.id === it.id); i >= 0 ? items[i] = it : items.push(it); render();
    apply(await call("saveItem", it));
  }
  async function remove(id) {
    items = items.filter((x) => x.id !== id); render();
    apply(await call("deleteItem", id));
  }
  async function refresh() {
    if (document.hidden || editId) return;
    try { apply(await call("listItems")); }
    catch { $("note").textContent = "목록을 불러오지 못했습니다. 인터넷 연결을 확인하세요."; }
  }

  // ---- form ----
  function setMode(m) {
    mode = m;
    $("mDate").setAttribute("aria-pressed", m === "date");
    $("mPeriod").setAttribute("aria-pressed", m === "period");
    $("byDate").hidden = m !== "date";
    $("byPeriod").hidden = m !== "period";
    updatePreview();
  }
  function readForm() {
    const it = { name: $("fName").value.trim(), memo: $("fMemo").value.trim(), mode };
    if (mode === "date") { if (!$("fExpiry").value) return null; it.expiry = $("fExpiry").value; }
    else {
      const num = parseInt($("fNum").value, 10);
      if (!$("fMfg").value || !(num > 0)) return null;
      Object.assign(it, { mfg: $("fMfg").value, num, unit: $("fUnit").value });
    }
    return it;
  }
  function updatePreview() {
    const it = readForm();
    if (!it) { $("preview").textContent = mode === "date" ? "유통기한 날짜를 선택하세요." : "제조일자와 기간을 입력하면 유통기한이 계산됩니다."; return; }
    const exp = expiryOf(it), n = daysLeft(exp);
    $("preview").innerHTML = `유통기한 <b>${fmt(exp)}</b> · ${n < 0 ? `${-n}일 지남` : n === 0 ? "오늘까지" : `${n}일 남음`}`;
  }
  function resetForm() {
    editId = null;
    $("form").reset();
    $("fNum").value = 3;
    document.querySelectorAll(".quick button").forEach((x) => x.classList.remove("on"));
    $("submit").textContent = "추가";
    $("formTitle").textContent = "품목 추가";
    $("nameHint").hidden = true;
    $("cancel").hidden = true;
    setMode(mode);
  }
  function startEdit(it) {
    editId = it.id;
    $("fName").value = it.name; $("fMemo").value = it.memo || "";
    if (it.mode === "period") { $("fMfg").value = it.mfg; $("fNum").value = it.num; $("fUnit").value = it.unit; }
    else $("fExpiry").value = it.expiry;
    setMode(it.mode);
    $("submit").textContent = "수정 저장";
    $("formTitle").textContent = "품목 수정";
    $("cancel").hidden = false;
    openForm(true);
    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
    $("fName").focus({ preventScroll: true });
  }

  $("mDate").onclick = () => setMode("date");
  // 빠른 날짜: 오늘부터 +3일 / +7일 / +1개월 / +3개월
  document.querySelector(".quick").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-add]"); if (!b) return;
    const n = parseInt(b.dataset.add, 10), unit = b.dataset.add.slice(-1);
    $("fExpiry").value = addPeriod(toISO(today()), n, unit);
    document.querySelectorAll(".quick button").forEach((x) => x.classList.toggle("on", x === b));
    updatePreview();
  });
  $("fExpiry").addEventListener("input", () => document.querySelectorAll(".quick button").forEach((x) => x.classList.remove("on")));
  $("mPeriod").onclick = () => setMode("period");

  // ---- 입력칸 접기: 평소엔 목록 위주, [+ 품목 추가]를 눌러야 펼침 ----
  function openForm(open) { $("form").hidden = !open; $("addOpen").hidden = open; }
  $("addOpen").onclick = () => { openForm(true); $("fName").focus(); };
  $("formClose").onclick = () => { resetForm(); openForm(false); };

  // ---- 품목명 자동완성 + 중복 경고 ----
  const norm = (s) => String(s || "").replace(/\s+/g, "").toLowerCase();
  function nameHint() {
    const key = norm($("fName").value);
    const same = key ? items.filter((x) => norm(x.name) === key && x.id !== editId) : [];
    if (!same.length) { $("nameHint").hidden = true; return; }
    const near = same.map((x) => ({ x, n: daysLeft(expiryOf(x)) })).sort((a, b) => a.n - b.n)[0];
    $("nameHint").innerHTML = `<span class="dup">이미 ${same.length}개 있음 · ${ddayText(near.n)} (${fmt(expiryOf(near.x)).slice(5)})</span>`;
    $("nameHint").hidden = false;
  }
  $("fName").addEventListener("input", nameHint);
  $("form").addEventListener("input", updatePreview);
  $("cancel").onclick = resetForm;
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const it = readForm();
    if (!it || !it.name) { updatePreview(); if (!it?.name) $("fName").focus(); return; }
    it.id = editId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    it.updatedAt = Date.now();
    $("submit").disabled = true;
    try {
      await save(it); resetForm(); $("fName").focus();
    }
    catch { $("preview").textContent = "저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."; }
    finally { $("submit").disabled = false; }
  });
  $("q").addEventListener("input", render);

  // ---- render ----
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function render() {
    const rows = items.map((it) => { const exp = expiryOf(it); return { it, exp, n: daysLeft(exp) }; })
      .sort((a, b) => a.n - b.n || a.it.name.localeCompare(b.it.name, "ko"));
    const c = { exp: 0, soon: 0, ok: 0 };
    rows.forEach((r) => c[status(r.n)]++);
    $("cExp").textContent = c.exp; $("cSoon").textContent = c.soon; $("cOk").textContent = c.ok;
    $("total").textContent = rows.length ? `· ${rows.length}개` : "";

    // 교체 필요: 유통기한 30일 미만 (지난 품목 포함), 급한 순
    const need = rows.filter((r) => r.n < 30);
    $("needBox").innerHTML = `<div class="tb-head"><span class="t">교체 필요</span><span class="cnt">${need.length}개</span></div>` + (need.length
      ? `<div class="tb-list">${need.map((r) => `<span class="c ${r.n <= 7 ? "hot" : "warm"}">${esc(r.it.name)} <b>${ddayText(r.n)}</b></span>`).join("")}</div>`
      : `<span class="none">교체가 필요한 품목이 없습니다</span>`);
    // 자동완성 목록
    const names = [...new Set(items.map((x) => x.name))].sort((a, b) => a.localeCompare(b, "ko"));
    $("nameList").innerHTML = names.map((n) => `<option value="${esc(n).replace(/"/g, "&quot;")}"></option>`).join("");

    const q = $("q").value.trim().toLowerCase();
    const shown = q ? rows.filter((r) => (r.it.name + " " + (r.it.memo || "")).toLowerCase().includes(q)) : rows;
    $("list").hidden = !shown.length;
    $("empty").hidden = !!shown.length;
    $("empty").textContent = rows.length ? "검색 결과가 없습니다." : "아직 등록된 제품이 없습니다. [+ 품목 추가]를 눌러 시작하세요.";

    $("list").innerHTML = shown.map(({ it, exp, n }) => {
      const s = status(n);
      const basis = it.mode === "period" ? `<span>제조 ${fmt(it.mfg)} + ${it.num}${UNIT[it.unit]}</span>` : "";
      const memo = it.memo ? `<span>${esc(it.memo)}</span>` : "";
      const del = pendingDelete === it.id
        ? `<button class="confirm" data-act="del" data-id="${it.id}">삭제 확인</button><button data-act="keep">취소</button>`
        : `<button data-act="edit" data-id="${it.id}">수정</button><button data-act="ask" data-id="${it.id}">삭제</button>`;
      return `<li class="${n < 0 ? "expired" : ""}">
        <div class="dday ${s}">${ddayText(n)}</div>
        <div class="info"><div class="txt"><div class="name">${esc(it.name)}</div>
          <div class="meta"><span>유통기한 <span class="date">${fmt(exp)}</span></span>${basis}${memo}</div></div></div>
        <div class="ops">${del}</div></li>`;
    }).join("");
  }
  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "edit") startEdit(items.find((x) => x.id === id));
    else if (act === "ask") { pendingDelete = id; render(); }
    else if (act === "keep") { pendingDelete = null; render(); }
    else if (act === "del") { pendingDelete = null; if (editId === id) resetForm(); try { await remove(id); } catch { refresh(); } }
  });

  // ---- boot ----
  const t = today();
  $("today").textContent = `${pad(t.getMonth() + 1)}.${pad(t.getDate())} ${"일월화수목금토"[t.getDay()]}`;
  $("fExpiry").value = ""; setMode("date");
  setData(lsLoad()); render();

  // ---- 전달사항: 바로 쓰고, 멈추면 자동 저장 ----
  function fitNotice() { const t = $("noticeInput"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  function renderNotice() {
    const t = $("noticeInput");
    if (document.activeElement !== t && !noticeDirty) { t.value = (notice && notice.memo) || ""; fitNotice(); }
    if (!noticeDirty) { $("noticeTime").textContent = ""; $("noticeTime").classList.remove("err"); }
  }
  async function saveNotice() {
    clearTimeout(noticeTimer);
    if (!noticeDirty) return;
    const text = $("noticeInput").value.trim().slice(0, 200);
    const it = { id: NOTICE_ID, name: "전달사항", memo: text, mode: "note", expiry: "2099-12-31", mfg: "", num: 0, unit: "", updatedAt: Date.now() };
    try { const list = await call("saveItem", it); noticeDirty = false; notice = it; apply(list); }
    catch { $("noticeTime").textContent = "저장 안 됨 · 인터넷 확인"; $("noticeTime").classList.add("err"); }
  }
  $("noticeInput").addEventListener("input", () => {
    noticeDirty = true; fitNotice();
    clearTimeout(noticeTimer); noticeTimer = setTimeout(saveNotice, 1500);
  });
  $("noticeInput").addEventListener("blur", saveNotice);

  // ---- 매장 품목 전체 초기화 (확인창) ----
  $("resetStore").textContent = storeKnown ? STORES[STORE].name : "";
  const closeReset = () => { $("resetBox").hidden = true; $("resetMsg").textContent = ""; $("resetGo").disabled = false; };
  $("resetOpen").onclick = () => { $("resetBox").hidden = false; $("resetCancel").focus(); };
  $("resetCancel").onclick = closeReset;
  $("resetBox").addEventListener("click", (e) => { if (e.target.id === "resetBox") closeReset(); });
  $("resetGo").onclick = async () => {
    $("resetGo").disabled = true; $("resetMsg").textContent = "";
    $("resetGo").textContent = "지우는 중…";
    try { const keep = notice; apply(await call("clearItems")); if (keep) apply(await call("saveItem", keep)); resetForm(); closeReset(); $("note").textContent = "품목을 모두 지웠습니다."; }
    catch { $("resetMsg").textContent = "지우지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."; $("resetGo").disabled = false; }
    finally { $("resetGo").textContent = "초기화"; }
  };

  if (!storeKnown) {
    $("resetZone").hidden = true;
    $("form").hidden = true; $("list").hidden = true; $("addOpen").hidden = true; $("todayBar").hidden = true;
    $("empty").textContent = "등록되지 않은 매장 링크입니다. 받은 링크를 다시 확인해 주세요.";
    return;
  }
  refresh();
  setInterval(refresh, 20000);
  document.addEventListener("visibilitychange", refresh);
})();
</script>
</body>
</html>
