<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>발주앱 GW 자동입력</title>
<style>
  body { width: 320px; margin: 0; padding: 16px; font: 14px/1.45 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #222; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #707070; font-size: 12.5px; }
  label { display: grid; gap: 4px; margin-bottom: 10px; font-size: 12.5px; font-weight: 700; }
  input[type=text], input[type=password] { font: inherit; padding: 9px 10px; border: 1px solid #ddd; border-radius: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; font-weight: 700; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 16px; background: #222; color: #fff; cursor: pointer; }
  button.ghost { background: #f0f0f0; color: #222; }
  #st { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #f4f4f4; font-size: 12.5px; }
  #log { margin-top: 8px; font-size: 11px; color: #707070; max-height: 140px; overflow: auto; white-space: pre-line; }
</style></head>
<body>
  <h1>발주앱 GW 자동입력</h1>
  <p>평소엔 창 없이 대기 → 폰에서 GW 전송을 누르면 그때만 작은 창으로 GW·MIS를 열어 넣고 저장한 뒤 닫아요(1~2분). 아이디·비밀번호는 이 PC 크롬 안에만 저장돼요.</p>
  <label>GW 아이디<input type="text" id="id" autocomplete="off"></label>
  <label>비밀번호<input type="password" id="pw" autocomplete="new-password" placeholder="저장됨이면 비워 둬도 돼요"></label>
  <div class="row"><input type="checkbox" id="on"> <span>자동입력 켜기</span></div>
  <button id="save">저장</button> <button class="ghost" id="open">MIS 직접 열어 보기</button>
  <div id="st">확인 중…</div>
  <div id="log"></div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body></html>
